name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgbm-dev

      - name: Install Python dependencies
        run: |
          python -m pip install uv==0.10.4
          uv sync --locked --extra dev

      - name: Install Playwright browser
        run: uv run playwright install chromium

      - name: Run unit tests
        # Use bare `pytest` (no path arg) so it picks up both tests/ and
        # huginn/tests/ via pyproject.toml's testpaths config. Hardcoding
        # `pytest tests/` would silently skip the 32 tests in huginn/tests/.
        # The single ignore below is real (test_integration.py requires a
        # live network + Playwright chromium); the other three ignores from
        # earlier versions reference files that no longer exist.
        run: |
          uv run pytest \
            --timeout=30 \
            -x \
            -q \
            --tb=short \
            --ignore=tests/test_integration.py \
            --cov=huginn \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Deep health check
        # Run huginn doctor --check to verify the full stack works
        # end-to-end. Non-zero exit on FAIL — catches broken Playwright,
        # missing LLM creds, or webhook signing issues before merge.
        run: |
          uv run huginn doctor --check || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.11'
        with:
          name: huginn-coverage-py311
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huginn"
version = "1.2.0"
description = "Huginn — Odin's raven. Autonomous web scraping, crawling, and extraction API. Stealth-first, self-hosted."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Phnix"}
]
keywords = [
    "huginn", "scrape", "crawl", "spider", "api", "stealth",
    "browser", "automation", "agent", "llm", "web",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0.0",
    "croniter>=2.0.0",
    "slowapi>=0.1.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "defusedxml>=0.7.0",
]

[project.optional-dependencies]
starsearch = ["starsearch-client>=0.1.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
google = ["google-genai>=0.1.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
huginn = "huginn.cli:main"

[project.urls]
Homepage = "https://github.com/Null-Phnix/Huginn"
Repository = "https://github.com/Null-Phnix/Huginn"

[tool.setuptools.packages.find]
where = ["."]
include = ["huginn*"]

[tool.setuptools.package-data]
huginn = ["prompts/*.txt"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not network'"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "network: marks tests as requiring network access",
    "slow: marks tests as slow (>5s)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
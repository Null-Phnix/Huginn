[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackcrawl"
version = "1.0.0"
description = "Autonomous web scraping and crawling API — Firecrawl-compatible, stealth-first, self-hosted"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Phnix"}
]
keywords = [
    "scrape", "crawl", "spider", "api", "stealth",
    "browser", "automation", "agent", "llm", "web",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
starsearch = ["starsearch-client>=0.1.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
google = ["google-genai>=0.1.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
blackcrawl = "blackcrawl.cli:main"

[project.urls]
Homepage = "https://github.com/Null-Phnix/BlackCrawl"
Repository = "https://github.com/Null-Phnix/BlackCrawl"

[tool.setuptools.packages.find]
where = ["."]
include = ["blackcrawl*"]

[tool.setuptools.package-data]
blackcrawl = ["prompts/*.txt"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "network: marks tests as requiring network access",
    "slow: marks tests as slow (>5s)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]